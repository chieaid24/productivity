<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Morning Dashboard Schedule</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      display: grid;
      place-items: center;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img id="schedule" alt="Weekly schedule">
  <script>
    // Image path is passed by the dashboard as ?img=<encoded file url>.
    const img = new URLSearchParams(location.search).get("img");
    document.getElementById("schedule").src = img || "../.private/WEEKLY%20SCHEDULE.jpg";
  </script>
</body>
</html>
