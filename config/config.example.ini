; Copy to config.local.ini at the repo root (or config/config.local.ini)
; and fill in local values. config.local.ini is gitignored.
; The tray settings dialogs edit this file in place.

[Timer]
; Reminder toast every N minutes (1-1440).
IntervalMinutes=20
Message=Water, breathe, flat, posture
; default | reminder | mail | instant_message | text_message | silent | custom
Sound=default
; Full path to a .wav file, used when Sound=custom.
CustomSound=

[Dashboard]
; AutoHotkey hotkey syntax. ^!m = Ctrl+Alt+M.
Hotkey=^!m

[Dashboard.Brave]
; Full path to brave.exe. Blank = auto-detect common install locations.
Executable=
; Brave profile directory name (e.g. Default, Profile 1).
; Blank = Brave's normal current-profile behavior, keeping existing logins.
ProfileDirectory=

[Dashboard.Outlook]
; new (Store app, olk.exe) or classic (OUTLOOK.EXE).
Prefer=new
; Full path to classic OUTLOOK.EXE. Blank = auto-detect.
Executable=
; App user model ID for new Outlook. Blank = auto-detect at install.
AppId=

[Dashboard.Calendar]
Url=https://calendar.google.com/calendar/u/0/r

[Dashboard.Gmail]
; Opened left to right as tabs in one new Brave window.
Url1=https://mail.google.com/mail/u/1/#inbox
Url2=https://mail.google.com/mail/u/0/#inbox
Url3=https://mail.google.com/mail/u/2/#inbox

[Dashboard.Schedule]
; Paths are relative to the repo root. .private/ is never committed.
LocalImage=.private\WEEKLY SCHEDULE.jpg
Viewer=viewer\schedule.html

[Dashboard.Monitors]
; Monitor numbers (1-based AutoHotkey indexes). Blank = auto-detect:
; left = smallest work-area center X, right = largest.
LeftMonitor=
RightMonitor=

[FocusSwitcher]
HotkeyLeft=^!Left
HotkeyRight=^!Right
; Move the mouse pointer to the focused window.
MoveMouse=0
; Wrap to the opposite edge when no monitor lies in the pressed direction.
WrapMonitors=1

[UsageTracker]
Hotkey=^!u
ClaudeUrl=https://claude.ai/settings/usage
CodexUrl=https://chatgpt.com/codex/settings/usage
; Full path to chrome.exe. Blank = auto-detect.
ChromeExecutable=
; mouse | foreground | primary
MonitorSelection=mouse
; Popup sizing in percent of the work area; gap/margin in logical pixels.
WidthPercent=86
HeightPercent=80
Gap=12
OuterMargin=24
KeepOnTop=0
